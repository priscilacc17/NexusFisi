# Prometheus de NEXUS: lee /api/v1/metrics cada 15 s y evalúa las alertas.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alertas.yml

scrape_configs:
  - job_name: nexus-api
    metrics_path: /api/v1/metrics
    authorization:
      type: Bearer
      credentials_file: /tmp/metrics_token
    static_configs:
      - targets: ["api:4000"]
