# Gateway de NexusFisi: único punto de entrada.
#   /api/*  → API (Hono)       /  → frontend (TanStack Start)
# Aplica límite de peticiones, tamaño máximo de cuerpo y cabeceras de seguridad.

limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_status 429;

upstream api { server api:4000; keepalive 16; }
upstream web { server web:3000; keepalive 16; }

map $http_x_request_id $req_id { default $http_x_request_id; "" $request_id; }

server {
  listen 80;
  server_name _;
  server_tokens off;

  # 5 archivos de 5 MB por envío, con margen para el formulario.
  client_max_body_size 30m;


  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Request-Id $req_id;

  location /api/ {
    limit_req zone=api burst=40 nodelay;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    proxy_read_timeout 60s;
    proxy_pass http://api;
  }

  location = /healthz { access_log off; return 200 "ok\n"; }

  # La CSP (con nonce por petición) y las demás cabeceras de la interfaz las
  # pone el propio servidor de la interfaz (src/server.ts), igual que en Render.
  location / {
    proxy_pass http://web;
  }
}
