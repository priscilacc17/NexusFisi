# Despliegue de NexusFisi en una VM: MySQL + API + frontend + gateway nginx.
#   cp .env.example .env   (y completa los secretos)
#   docker compose up -d --build        # construye localmente
#   docker compose pull && docker compose up -d   # usa las imágenes publicadas por CI/CD
name: nexusfisi

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-nexusfisi}
      MYSQL_USER: ${MYSQL_USER:-nexusfisi}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Define MYSQL_PASSWORD en .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Define MYSQL_ROOT_PASSWORD en .env}
      TZ: UTC
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
    # Sin puertos publicados: solo la API llega a la base, por la red interna.

  api:
    image: ${REGISTRY:-ghcr.io/priscilacc17}/nexusfisi-api:${TAG:-latest}
    build: ../api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: mysql://${MYSQL_USER:-nexusfisi}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-nexusfisi}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      CORS_ORIGINS: ${PUBLIC_URL:-http://localhost}
      TRUST_PROXY: "true"
      MIGRATE_ON_START: "true"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      UPLOAD_DIR: /data/uploads
      STORAGE_DRIVER: disk
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost}
      COOKIE_SECURE: ${COOKIE_SECURE:-auto}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_REDIRECT_TO: ${MAIL_REDIRECT_TO:-}
    volumes:
      - uploads:/data/uploads

  web:
    image: ${REGISTRY:-ghcr.io/priscilacc17}/nexusfisi-web:${TAG:-latest}
    build:
      context: ..
      args:
        VITE_MOSTRAR_DEMO: ${MOSTRAR_DEMO:-true}
    restart: unless-stopped
    environment:
      NODE_ENV: production

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [api, web]
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  mysql-data:
  uploads:
