# Entrega continua. Corre SOLO cuando el CI terminó bien en main: un cambio que
# rompe pruebas nunca llega a producción.
#
#  · Render (despliegue principal): secreto RENDER_DEPLOY_HOOK_URL
#    (Render → servicio → Settings → Deploy Hook). Render construye Dockerfile.render.
#  · VM con docker compose (alternativa): publica imágenes en GHCR y despliega por SSH
#    si existen VM_HOST, VM_USER y VM_SSH_KEY en el entorno "produccion".
name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  render:
    name: Desplegar en Render
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: produccion
    steps:
      - name: Disparar el deploy hook
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          if [ -z "$HOOK" ]; then echo "::warning::Sin RENDER_DEPLOY_HOOK_URL: no se desplegó en Render."; exit 0; fi
          # ref=<sha> despliega exactamente el commit que pasó el CI.
          curl -fsS -X POST "${HOOK}&ref=${SHA}" -o /dev/null
          echo "Despliegue solicitado a Render para ${SHA}"
      - name: Esperar a que la nueva versión responda
        env:
          URL: ${{ vars.PUBLIC_URL }}
        run: |
          if [ -z "$URL" ]; then echo "Define la variable PUBLIC_URL del entorno para verificar el despliegue."; exit 0; fi
          for i in $(seq 1 60); do
            if curl -fsS "$URL/api/v1/health" | grep -q '"status":"ok"'; then echo "OK"; exit 0; fi
            sleep 10
          done
          echo "::error::La aplicación no respondió en $URL"; exit 1

  imagenes:
    name: Publicar imágenes (VM)
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - id: tag
        env:
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: echo "tag=main-${SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: API
        uses: docker/build-push-action@v6
        with:
          context: api
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/nexusfisi-api:${{ steps.tag.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/nexusfisi-api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/nexusfisi-web:${{ steps.tag.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/nexusfisi-web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  vm:
    name: Desplegar en la VM (opcional)
    needs: imagenes
    runs-on: ubuntu-latest
    environment: produccion
    steps:
      - name: Verificar configuración
        id: cfg
        env:
          HOST: ${{ secrets.VM_HOST }}
        run: |
          if [ -z "$HOST" ]; then echo "::notice::Sin VM_HOST: se omite la VM."; echo "ok=false" >> "$GITHUB_OUTPUT"; else echo "ok=true" >> "$GITHUB_OUTPUT"; fi
      - name: docker compose pull && up
        if: steps.cfg.outputs.ok == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -e
            cd "${{ secrets.VM_PATH || '/opt/nexusfisi' }}"
            sed -i "s/^TAG=.*/TAG=${{ needs.imagenes.outputs.tag }}/" .env
            docker compose pull api web
            docker compose up -d --remove-orphans
            docker image prune -f
            for i in $(seq 1 30); do curl -fsS http://localhost/api/v1/health && exit 0; sleep 4; done
            echo "La API no respondió tras el despliegue"; docker compose logs --tail=80 api; exit 1
